[package]
name    = "aniremind"
version = "2026.1111.0"
edition = "2024"

[[bin]]
name = "aniremind"
path = "src/main.rs"

[dependencies]
clap                  = { version = "4.6", features = ["derive"] }
clap_complete         = "4.6"
clap_complete_nushell = "4"
jiff                  = "0.2"
rustls                = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
ureq                  = { version = "3", default-features = false, features = ["json", "platform-verifier", "rustls-no-provider"] }

[profile.release]
strip = true
