[workspace]
members = ["generator"]

[workspace.package]
version = "2026.1112.0"
edition = "2024"
license = "CC-BY-NC-4.0"

[package]
name              = "ysun"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ysun"
path = "src/main.rs"

[dependencies]
axum       = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
jiff       = { version = "0.2", default-features = false, features = ["serde", "std"] }
listenfd   = "1"
rustls     = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["macros", "net", "rt", "sync"] }
ureq       = { version = "3", default-features = false, features = ["platform-verifier", "rustls-no-provider"] }

[build-dependencies]
generator = { path = "generator" }

[profile.release]
strip = true

[profile.release.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
