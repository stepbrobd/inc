version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 0
    commit-message:
      prefix: "flake"
    groups:
      inputs:
        patterns:
          - "*"
